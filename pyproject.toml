[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-diagnostic-agent"
version = "0.1.0"
description = "Safe, local home-server diagnostic chat agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ssh = ["paramiko>=3.5,<4"]
voice = ["faster-whisper>=1.1,<2"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
